<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Brendin Sauer">
    <meta name="description" content="ADD DIS DESCRIPTION.">
<!--Google Fonts-->
<!--Font 1-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montenegrin+Gothic+One&display=swap" rel="stylesheet">
<!--Font 2-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montenegrin+Gothic+One&family=Smooch+Sans:wght@100..900&display=swap" rel="stylesheet">
<!-- Link to external files -->
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/getdates.js" defer></script>

    <title>Document</title>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form class="form1" method="get" action="review.html">
            <label>Product Name
                <select name="productName" id="productName" required>
                    <option value="" disabled selected>Choose a Product &#9662;</option>
                    <option value="placeholder" >placeholder</option>
                </select>
            </label>

            <div>Overall rating</div>
            <section id="radioButtons">
                <label>*<input type="radio" name="rating" id="one" value="one" class="starRating" required></label>
                <div></div>
                <label>**<input type="radio" name="rating" id="two" value="two" class="starRating" required></label>
                <div></div>
                <label>***<input type="radio" name="rating"  id="three" value="three" class="starRating" required></label>
                <div></div>
                <label>****<input type="radio" name="rating"  id="four" value="four" class="starRating" required></label>
                <label>*****<input type="radio" name="rating" id="five" value="five" class="starRating" required></label>
            </section>
                

                <label>Date of Installation <input type="date" name="installDate" id="installDate"></input></label>
                <section class="checkSection">
                    <div>Which features did you find useful in the product?</div>
                    <span id="optional">(Check all that apply)</span>
                    <label class="checkSelections"><input type="checkbox" name="durability" id="durability" value="yes"> Durability</label>
                    <label class="checkSelections"><input type="checkbox" name="ease" id="ease" value="yes"> Ease of Use</label>
                    <label class="checkSelections"><input type="checkbox" name="performance" id="performance" value="yes"> Performance</label>
                    <label class="checkSelections"><input type="checkbox" name="design" id="design" value="yes"> Design</label>
                </section>
                <label>Written Review <span class="multiOptional">(optional)</span><input type="textarea"  name="review"></label>
                <label>Your Name <span class="multiOptional">(optional)<input type="text"  name="name" id="name"></label>

                <input type="submit" value="Post Review">
        </form>
    </main>
    <footer>
        <p id="copyright"><span id="current-year">c</span>&#11088; Brendin Sauer &#11088; Layton Utah</p>
        <p id="lastModified">last</p>
    </footer>
</body>
</html>
